# Postgres pentru dezvoltare locala. RDS va sta intr-un subnet privat, deci nu e
# accesibila de pe laptop — versiunea de aici o oglindeste pe cea din productie,
# ca diferentele de comportament sa nu apara abia la deploy.
services:
  db:
    image: postgres:17-alpine
    container_name: almek-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: almek
      POSTGRES_PASSWORD: almek
      POSTGRES_DB: almek
    ports:
      - "5432:5432"
    volumes:
      - almek-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almek -d almek"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  almek-db-data:
